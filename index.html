<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرات حاتم وورد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#BFE6F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app" class="app" dir="rtl" lang="ar" aria-live="polite">

  <!-- طبقات المشهد -->
  <div id="bg" class="bg" aria-hidden="true"></div>
  <div id="cast" class="cast" aria-hidden="true"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <!-- شريط الأدوات العلوي (يظهر أثناء اللعب) -->
  <header id="hud" class="hud" hidden>
    <div class="hud-tools">
      <button id="btnHome" class="tool" type="button" aria-label="إعادة المغامرة من البداية">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>
      </button>
      <button id="btnReplayScene" class="tool" type="button" aria-label="إعادة المشهد">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.7 10h2.1A6 6 0 1 0 12 6v3L7 5l5-4z"/></svg>
      </button>
      <button id="btnMute" class="tool" type="button" aria-label="كتم الصوت" aria-pressed="false">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="stars" class="stars" aria-label="النجوم"></div>
  </header>

  <!-- شاشة البداية -->
  <section id="screenStart" class="screen screen-start">
    <div class="title-card">
      <p class="eyebrow">مغامرة في غابة الديناصورات</p>
      <h1 class="title">مغامرات <span class="t-hatem">حاتم</span> و<span class="t-ward">ورد</span></h1>
    </div>
    <div class="start-actions">
      <button id="btnStart" class="big-btn primary" type="button">
        <span class="big-ico" aria-hidden="true">▶</span><span>ابدأ</span>
      </button>
      <button id="btnContinue" class="big-btn secondary" type="button" hidden>
        <span class="big-ico" aria-hidden="true">⤺</span><span>أكمل المغامرة</span>
      </button>
    </div>
  </section>

  <!-- زر استوديو التسجيل (للكبار: ضغطة مطوّلة) -->
  <button id="btnStudio" class="studio-open" type="button" aria-label="استوديو التسجيل (اضغطي مطوّلًا)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- شاشة اختيار الشخصية -->
  <section id="screenSelect" class="screen screen-select" hidden>
    <h2 class="select-title">مين تبغى تكون؟</h2>
    <div class="select-row">
      <button class="pick pick-hatem" type="button" data-pick="hatem">
        <span class="pick-art" data-art="hatem"></span>
        <span class="pick-name">حاتم</span>
      </button>
      <button class="pick pick-ward" type="button" data-pick="ward">
        <span class="pick-art" data-art="ward"></span>
        <span class="pick-name">ورد</span>
      </button>
    </div>
  </section>

  <!-- الحوار -->
  <section id="dialogue" class="dialogue" hidden>
    <div class="say">
      <span id="speaker" class="speaker"></span>
      <p id="lineText" class="line-text"></p>
    </div>
    <div class="say-actions">
      <button id="btnReplayLine" class="round-btn ghost" type="button" aria-label="أعد الجملة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="btnNext" class="round-btn next" type="button" aria-label="التالي">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnRetry" class="big-btn retry" type="button" hidden>
        <span class="big-ico" aria-hidden="true">↻</span><span>نجرّب مرة ثانية</span>
      </button>
    </div>
  </section>

  <!-- الاختيارات -->
  <section id="choices" class="choices" hidden>
    <div id="choiceRow" class="choice-row"></div>
  </section>

  <!-- المكافأة -->
  <section id="screenReward" class="screen screen-reward" hidden>
    <div class="reward-card">
      <div class="medal" aria-hidden="true">
        <svg viewBox="0 0 120 120"><path d="M40 6h14l6 26-14 6zM80 6H66l-6 26 14 6z" fill="#E86A5A"/><circle cx="60" cy="72" r="42" fill="#FFC93C"/><circle cx="60" cy="72" r="33" fill="#FFDD73"/><path d="m60 46 8 17 18 2-13 12 4 18-17-9-17 9 4-18-13-12 18-2z" fill="#F29A1E"/></svg>
      </div>
      <h2 class="reward-title">نجمة الصديق المتعاون</h2>
      <p class="reward-sub">قلنا وش نحس فيه، وطلبنا بلطف، وتعاوننا.</p>
      <div class="reward-actions">
        <button id="btnAgain" class="big-btn primary" type="button"><span class="big-ico" aria-hidden="true">↻</span><span>العب مرة ثانية</span></button>
        <button id="btnSwap" class="big-btn secondary" type="button"><span class="big-ico" aria-hidden="true">⇄</span><span id="swapLabel">العب بشخصية ورد</span></button>
      </div>
    </div>
  </section>

  <!-- تأكيد إعادة المغامرة -->
  <div id="confirm" class="confirm" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p id="confirmTitle" class="confirm-title">نرجع لأول المغامرة؟</p>
      <div class="confirm-actions">
        <button id="btnConfirmYes" class="big-btn primary" type="button">نعم</button>
        <button id="btnConfirmNo" class="big-btn secondary" type="button">لا، نكمل</button>
      </div>
    </div>
  </div>

  <div id="curtain" class="curtain" aria-hidden="true"></div>

  <!-- استوديو التسجيل -->
  <section id="studio" class="studio" hidden aria-labelledby="studioTitle">
    <header class="st-head">
      <div class="st-top">
        <h2 id="studioTitle" class="st-title">استوديو التسجيل</h2>
        <button id="studioClose" class="st-close" type="button" aria-label="إغلاق الاستوديو والعودة للعبة">✕</button>
      </div>
      <p id="studioNote" class="st-note" hidden>المتصفح هنا لا يسمح بالميكروفون. افتحي اللعبة من موقعها على GitHub في Safari لتسجّلي.</p>
      <div id="studioWho" class="st-who" role="toolbar" aria-label="اختيار المتكلم"></div>
      <div class="st-row">
        <div class="st-prog" aria-hidden="true"><i id="studioFill"></i></div>
        <span id="studioCount" class="st-count"></span>
        <label class="st-toggle"><input type="checkbox" id="studioMissing"> غير المسجّل فقط</label>
      </div>
    </header>
    <div id="studioList" class="st-list"></div>
    <footer class="st-foot">
      <button id="studioExport" class="st-btn primary" type="button">⬇ تصدير التسجيلات</button>
      <button id="studioImport" class="st-btn ghost" type="button">استيراد ملف</button>
      <input id="studioImportFile" type="file" accept=".zip,application/zip" hidden>
    </footer>
  </section>

  <div id="studioToast" class="st-toast" role="status" hidden></div>
</main>

<script src="assets/assets.js"></script>
<script src="assets/audio/manifest.js"></script>
<script src="js/story.js"></script>
<script src="js/characters.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/recordings.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/studio.js"></script>
</body>
</html>
